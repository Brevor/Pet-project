<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudioCRM — прототип ядра студии</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#fff; --text:#151823; --muted:#6b7280; --line:#e6e8f1;
    --accent:#6d28d9; --accent-2:#8b5cf6; --accent-soft:#f2ecfe;
    --danger:#ef4444; --warn:#b45309;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 26px -14px rgba(16,24,40,.22);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{font:inherit; color:inherit}

  .top{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:16px;
    height:62px; padding:0 20px; background:#fff; border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:baseline; gap:8px; font-weight:700; white-space:nowrap}
  .brand span{color:var(--accent)}
  .brand small{font-weight:500; font-size:11px; color:var(--muted); max-width:160px; overflow:hidden; text-overflow:ellipsis}
  .tabs{display:flex; gap:3px; flex-wrap:wrap}
  .tab{border:0; background:transparent; padding:8px 12px; border-radius:10px; cursor:pointer; color:var(--muted); font-weight:500}
  .tab:hover{background:#f4f4f9; color:var(--text)}
  .tab.active{background:var(--accent-soft); color:var(--accent); font-weight:600}
  .spacer{flex:1}
  .actor{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap}
  .actor select{max-width:190px}

  .btn{border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 13px; cursor:pointer; white-space:nowrap}
  .btn:hover{background:#fafaff; border-color:#d9dbe7}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
  .btn.primary:hover{background:#5b21b6}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn.ghost:hover{background:#f4f4f9; color:var(--text)}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{background:#fef2f2}
  .btn.small{padding:5px 9px; font-size:12px}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  main{max-width:1440px; margin:0 auto; padding:18px 20px 70px}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .week-nav{display:flex; align-items:center; gap:6px}
  .week-label{font-weight:600; min-width:180px}
  .week-note{font-size:12px; color:var(--muted)}
  .filters{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
  select, input[type=text], input[type=email], input[type=date], input[type=time], input[type=number]{
    border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 10px; outline:none; max-width:100%;
  }
  select:focus, input:focus{border-color:var(--accent-2); box-shadow:0 0 0 3px rgba(139,92,246,.15)}

  .stats{display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:14px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; box-shadow:var(--shadow)}
  .stat-k{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
  .stat-v{font-size:23px; font-weight:700; margin:3px 0 1px}
  .stat-s{font-size:12px; color:var(--muted)}

  .calendar{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .cal-head, .cal-body{display:grid; grid-template-columns:66px repeat(7, 1fr)}
  .cal-inner{min-width:720px}
  .cal-head{position:sticky; top:0; z-index:12; background:#fafaff; border-bottom:1px solid var(--line)}
  .cal-head > div{padding:9px 6px; text-align:center; font-size:12px; color:var(--muted); border-left:1px solid #f0f1f7}
  .cal-head > div:first-child{border-left:0}
  .cal-day-head span{display:block; text-transform:uppercase; letter-spacing:.08em; font-size:10.5px}
  .cal-day-head b{font-size:15px; color:var(--text)}
  .cal-day-head.today b{color:var(--accent)}
  .cal-day-head.today{background:var(--accent-soft)}
  .cal-scroll{max-height:calc(100vh - 330px); overflow:auto}
  .cal-body{position:relative}
  .cal-times{position:relative; border-right:1px solid var(--line)}
  .cal-time{position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:#9aa0b0; font-variant-numeric:tabular-nums}
  .cal-col{
    position:relative; border-left:1px solid #f0f1f7; cursor:pointer;
    background-image:repeating-linear-gradient(to bottom, #eef0f7 0 1px, transparent 1px var(--hour-h));
  }
  .cal-col.today{background-color:#fcfbff}
  .cal-col.readonly{cursor:default}
  .evt{
    position:absolute; padding:5px 7px; border-radius:9px; overflow:hidden; cursor:pointer;
    background:var(--tint); border-left:3px solid var(--tc);
    box-shadow:0 1px 2px rgba(16,24,40,.06); z-index:2;
  }
  .evt:hover{box-shadow:0 6px 16px -6px rgba(16,24,40,.35); z-index:5}
  .evt-head{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--tc)}
  .evt-time{font-variant-numeric:tabular-nums}
  .evt-badge{font-size:9.5px; font-weight:700; text-transform:uppercase; background:#fff; color:var(--tc); border-radius:5px; padding:1px 4px}
  .evt-n{font-size:12px; font-weight:600; line-height:1.25; margin-top:1px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .evt-m{font-size:11px; color:#5b6072; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .evt.compact{padding:3px 6px}
  .evt.compact .evt-n{font-size:11px; -webkit-line-clamp:1}
  .now-line{position:absolute; left:0; right:0; height:0; border-top:2px solid #ef4444; z-index:6; pointer-events:none}
  .now-line i{position:absolute; left:-4px; top:-4px; width:7px; height:7px; border-radius:50%; background:#ef4444}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted)}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:middle}

  .table-wrap{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:14px}
  table{width:100%; border-collapse:collapse}
  th, td{padding:10px 13px; text-align:left; border-bottom:1px solid #f0f1f7; vertical-align:middle}
  th{background:#fafaff; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fcfbff}
  .pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:#f1f2f8; color:#4b5060}
  .pill.group{background:#eef2ff; color:#4338ca}
  .pill.indiv{background:#ecfdf5; color:#047857}
  .pill.weekly{background:#f5f3ff; color:#6d28d9}
  .pill.once{background:#fff7ed; color:#b45309}
  .pill.arch{background:#f3f4f6; color:#6b7280}
  .tname{font-weight:600}
  .muted{color:var(--muted)}
  .chips{display:flex; gap:4px; flex-wrap:wrap}
  .chip{padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; background:#eef2ff; color:#3730a3}
  .chip.owner{background:#fef3c7; color:#92400e}
  .chip.student{background:#ecfdf5; color:#047857}

  .add-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; box-shadow:var(--shadow)}
  .add-row .hint-inline{font-size:12px; color:var(--muted)}

  .rooms-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; margin-bottom:14px}
  .room-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow)}
  .room-card header{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .room-card h3{margin:0; font-size:15px}
  .bar{height:7px; border-radius:999px; background:#eef0f7; overflow:hidden; margin:10px 0 6px}
  .bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--accent-2), var(--accent))}
  .room-meta{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-top:4px}
  .room-meta b{color:var(--text)}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow)}
  .panel h3{margin:18px 0 8px; font-size:14px}
  .fields{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px}
  .field{display:flex; flex-direction:column; gap:5px}
  .field label{font-size:12px; color:var(--muted); font-weight:500}
  .hours{width:auto; margin-top:4px}
  .hours td{border-bottom:1px solid #f4f5fa; padding:6px 10px}
  .hours td:first-child{font-weight:600; width:130px}
  .row-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; padding-top:14px; border-top:1px solid #f0f1f7}

  .modal{position:fixed; inset:0; z-index:60; background:rgba(17,20,32,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto}
  .modal-panel{background:#fff; width:min(600px, 100%); border-radius:18px; box-shadow:0 30px 80px -20px rgba(10,12,25,.5); padding:20px 22px 18px}
  .modal-panel h3{margin:0 0 4px; font-size:17px}
  .modal-sub{margin:0 0 14px; font-size:12.5px; color:var(--muted)}
  .seg{display:inline-flex; background:#f1f2f8; border-radius:11px; padding:3px; gap:3px}
  .seg button{border:0; background:transparent; border-radius:8px; padding:7px 14px; cursor:pointer; color:var(--muted)}
  .seg button.active{background:#fff; color:var(--text); font-weight:600; box-shadow:0 1px 3px rgba(16,24,40,.14)}
  .modal-actions{display:flex; align-items:center; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid #f0f1f7}
  .modal-actions .spacer{flex:1}
  .hint{font-size:12px; color:var(--warn); background:#fffbeb; border:1px solid #fde68a; border-radius:9px; padding:8px 10px; margin-top:12px}
  .errors{background:#fef2f2; border:1px solid #fecaca; border-radius:10px; padding:10px 12px; margin-top:12px; font-size:12.5px; color:#b91c1c}
  .errors ul{margin:6px 0 0; padding-left:18px}
  .roles-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:8px}
  .roles-grid label{display:flex; align-items:center; gap:7px; font-size:13px}
  .toast{position:fixed; right:20px; bottom:20px; z-index:90; background:#111827; color:#fff; padding:11px 16px; border-radius:12px; font-size:13px; box-shadow:0 18px 40px -14px rgba(0,0,0,.6); opacity:0; transform:translateY(8px); transition:opacity .18s, transform .18s; pointer-events:none}
  .toast.show{opacity:1; transform:none}
  .toast.err{background:#b91c1c}
  .empty{padding:22px; color:var(--muted); font-size:13px}

  @media (max-width: 980px){
    .top{flex-wrap:wrap; height:auto; padding:10px 14px; gap:10px}
    main{padding:14px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .cal-head, .cal-body{grid-template-columns:52px repeat(7, minmax(96px, 1fr))}
    .fields{grid-template-columns:1fr}
    .filters{margin-left:0; width:100%}
    .roles-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Studio<span>CRM</span> <small id="studio-label">Dance Lab</small></div>
  <nav class="tabs">
    <button class="tab active" data-view="schedule">Расписание</button>
    <button class="tab" data-view="courses">Курсы</button>
    <button class="tab" data-view="rooms">Залы</button>
    <button class="tab" data-view="team">Команда</button>
    <button class="tab" data-view="studio">Студия</button>
  </nav>
  <div class="spacer"></div>
  <label class="actor">Вы: <select id="actor"></select></label>
  <button class="btn primary" id="btn-new">+ Сеанс</button>
</header>

<main>
  <!-- РАСПИСАНИЕ -->
  <section id="view-schedule">
    <div class="toolbar">
      <div class="week-nav">
        <button class="btn" id="prev-week" title="Предыдущая неделя">←</button>
        <button class="btn" id="today">Текущая неделя</button>
        <button class="btn" id="next-week" title="Следующая неделя">→</button>
      </div>
      <div>
        <span class="week-label" id="week-label"></span>
        <span class="week-note" id="week-note"></span>
      </div>
      <div class="filters">
        <select id="f-teacher"></select>
        <select id="f-room"></select>
        <select id="f-course"></select>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="calendar" id="calendar"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- КУРСЫ -->
  <section id="view-courses" hidden>
    <form id="course-form" class="add-row">
      <input type="text" id="c-name" placeholder="Название курса" maxlength="140" required style="min-width:220px">
      <input type="text" id="c-direction" placeholder="Направление" maxlength="40" style="width:150px">
      <select id="c-level">
        <option value="beginner">начинающие</option>
        <option value="intermediate">средние</option>
        <option value="advanced">продвинутые</option>
        <option value="none">без уровня</option>
      </select>
      <select id="c-kind">
        <option value="group">групповой</option>
        <option value="individual">индивидуальный</option>
      </select>
      <select id="c-duration">
        <option>45</option><option selected>60</option><option>75</option><option>90</option><option>120</option>
      </select>
      <input type="number" id="c-capacity" min="1" max="200" value="12" style="width:110px" title="Вместимость">
      <button class="btn primary" type="submit">Добавить курс</button>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Курс</th><th>Направление</th><th>Уровень</th><th>Тип</th><th>Длит.</th><th>Мест</th><th></th></tr></thead>
        <tbody id="courses-body"></tbody>
      </table>
    </div>
  </section>

  <!-- ЗАЛЫ -->
  <section id="view-rooms" hidden>
    <div class="rooms-grid" id="rooms-grid"></div>
    <div class="add-row">
      <input type="text" id="room-name" placeholder="Название зала" required style="min-width:180px">
      <input type="number" id="room-cap" placeholder="Мест" min="1" max="200" value="15" style="width:110px">
      <input type="text" id="room-note" placeholder="Комментарий" maxlength="60" style="min-width:200px">
      <button class="btn primary" id="room-add" type="button">Добавить зал</button>
    </div>
  </section>

  <!-- КОМАНДА -->
  <section id="view-team" hidden>
    <form id="invite-form" class="add-row">
      <input type="email" id="invite-email" placeholder="email зарегистрированного пользователя" required style="min-width:260px">
      <button class="btn primary" type="submit">Добавить участника</button>
      <span class="hint-inline">Приглашений нет: аккаунт должен быть создан ранее</span>
    </form>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Участник</th><th>Email</th><th>Роли</th><th>Статус</th><th></th></tr></thead>
        <tbody id="team-body"></tbody>
      </table>
    </div>
  </section>

  <!-- СТУДИЯ -->
  <section id="view-studio" hidden>
    <form id="studio-form" class="panel">
      <div class="fields">
        <div class="field">
          <label for="s-name">Название студии</label>
          <input type="text" id="s-name" maxlength="60" required>
        </div>
        <div class="field">
          <label for="s-tz">Часовой пояс</label>
          <select id="s-tz">
            <option value="Europe/Moscow">Europe/Moscow (+03:00)</option>
            <option value="Europe/Kaliningrad">Europe/Kaliningrad (+02:00)</option>
            <option value="Asia/Yekaterinburg">Asia/Yekaterinburg (+05:00)</option>
            <option value="Asia/Novosibirsk">Asia/Novosibirsk (+07:00)</option>
          </select>
        </div>
      </div>
      <h3>Рабочие часы</h3>
      <table class="hours"><tbody id="hours-body"></tbody></table>
      <div class="row-actions">
        <button class="btn primary" type="submit">Сохранить</button>
        <button class="btn danger" type="button" id="btn-archive">Архивировать студию</button>
        <button class="btn ghost" type="button" id="btn-reset">Сбросить демо-данные</button>
      </div>
    </form>
  </section>
</main>

<!-- МОДАЛ: СЕАНС -->
<div class="modal" id="session-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <h3 id="modal-title">Новый сеанс</h3>
    <p class="modal-sub" id="modal-sub">Конфликты по залу и преподавателю проверяются автоматически.</p>

    <form id="session-form" novalidate>
      <input type="hidden" id="f-repeat" value="weekly">
      <div class="fields">
        <div class="field">
          <label for="s-course">Курс</label>
          <select id="s-course"></select>
        </div>
        <div class="field">
          <label for="s-room">Зал</label>
          <select id="s-room"></select>
        </div>
        <div class="field">
          <label for="s-teacher">Преподаватель</label>
          <select id="s-teacher"></select>
        </div>
        <div class="field">
          <label>Повторяемость</label>
          <div class="seg" id="seg-repeat">
            <button type="button" data-repeat="weekly" class="active">Еженедельно</button>
            <button type="button" data-repeat="once">Разовое</button>
          </div>
        </div>
        <div class="field" id="row-weekday">
          <label for="f-weekday">День недели</label>
          <select id="f-weekday"></select>
        </div>
        <div class="field" id="row-date" hidden>
          <label for="f-date">Дата</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label for="f-start">Начало</label>
          <input type="time" id="f-start" step="900" value="18:00">
        </div>
        <div class="field">
          <label for="f-duration">Длительность</label>
          <select id="f-duration"></select>
        </div>
        <div class="field" id="row-until">
          <label for="f-until">Повторять до</label>
          <input type="date" id="f-until">
        </div>
      </div>

      <div class="hint" id="capacity-hint" hidden></div>
      <div class="errors" id="session-errors" hidden></div>

      <div class="modal-actions">
        <button type="button" class="btn danger ghost" id="btn-delete" hidden>Удалить</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="btn-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="btn-save">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- МОДАЛ: УЧАСТНИК -->
<div class="modal" id="member-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true">
    <h3 id="m-title">Участник</h3>
    <p class="modal-sub" id="m-sub">Ролей может быть несколько — права складываются.</p>
    <form id="member-form">
      <div class="field">
        <label for="m-email">Email</label>
        <input type="email" id="m-email" required>
      </div>
      <div class="field">
        <label>Роли</label>
        <div class="roles-grid" id="m-roles"></div>
      </div>
      <div class="errors" id="m-errors" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="m-deactivate" hidden>Деактивировать</button>
        <button type="button" class="btn ghost" id="m-transfer" hidden>Сделать владельцем</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="m-cancel">Отмена</button>
        <button type="submit" class="btn primary" id="m-save">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
